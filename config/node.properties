# Example primary node. Paths are relative to this file.
refdata.file=refdata.txt
journal.dir=../var/journal
data.dir=../var/data
accounts.max=256
# Recorded in the journal manifest: a journal only replays with the seed that wrote it.
engine.randomSeed=1

# End of day: DAY orders are cancelled at this local time. Blank to disable.
eod.schedule=17:00 America/New_York

# Agent idle strategy: backoff (shared hosts) or spin (isolated cores, production).
node.idleStrategy=backoff

# Journal force interval. A power loss can lose at most this much acknowledged input
# (plus whatever the standby had not yet received); a process crash loses nothing.
journal.flushMillis=10

fix.compId=CLOB
fix.bindHost=127.0.0.1
fix.port=9876
# Production passwords must be salted hashes from `clob hash-password`. Plain text is for development only.
fix.allowPlaintextCredentials=true
# fix.session.N = senderCompId,username,password,userId,cancelOnDisconnect,maxMsgsPerSec
fix.session.1=CLIENT1,user1,change-me,1,true,500
fix.session.2=CLIENT2,user2,change-me,2,true,500

admin.bindHost=127.0.0.1
admin.port=8080
admin.token=change-me
md.intervalMs=5
# Threads that build and deliver market data each cycle.
md.publishThreads=1
# UDP unicast snapshots to the subscriber's own IP (MarketDataRequest tag 20016 = port), re-sent every N cycles.
md.udp.enabled=false
md.udp.refreshCycles=200

# Primary: listen for a standby. Standby: set the primary's host/port instead.
replication.bindHost=127.0.0.1
replication.port=9900
# A standby that accepts no data for this long is disconnected and must reconnect.
replication.deadlineMillis=5000
#replication.primaryHost=127.0.0.1
#replication.primaryPort=9900
